# Temporal: prueba qué fuentes oficiales de Córdoba responden desde GitHub.
name: Diagnóstico Córdoba
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          NAV="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in https://www.rentascordoba.gob.ar/ https://www.cba.gov.ar/ https://www.saij.gob.ar/ https://normativa.cba.gov.ar/ https://www.legislaturacba.gob.ar/ https://boletinoficial.cba.gov.ar/; do
            echo "$(curl -s -o /dev/null -m 30 -w '%{http_code}' -A "$NAV" -L "$u") $u"
          done
