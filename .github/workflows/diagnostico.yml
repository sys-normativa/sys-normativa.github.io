# Temporal: confirma que el feed de Rentas Córdoba responde desde GitHub.
name: Diagnóstico Rentas
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; SYS-Normativa/0.1)"
          for u in https://www.rentascordoba.gob.ar/cms/feed/ "https://www.rentascordoba.gob.ar/cms/feed/?paged=2" https://www.rentascordoba.gob.ar/cms/resolucion-sip-n-19-2026-letra-d-baja-de-agentes-de-retencion-y-percepcion-de-ingresos-brutos/; do
            echo "$(curl -s -o /tmp/r -m 30 -w '%{http_code} %{size_download}' -A "$UA" -L "$u") $(grep -c '<item>' /tmp/r) $u"
          done
