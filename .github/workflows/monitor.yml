# Corre el monitor solo, publica la página y avisa por mail si hay algo nuevo.
#
# Quién lo lanza (horas de Argentina):
# - cron-job.org, todos los días a las 9:47 (el Boletín Oficial ya salió) y a
#   las 21:47 (el BCRA ya publicó lo del día), con "Run workflow".
# - Cada cambio subido a main.
# - Control de GitHub cada 3 horas. GitHub no respeta sus propios horarios
#   (del 4 al 6/10/2026 largó 3 de 8 corridas, con 6 a 8 h de atraso), así que
#   no se usa para revisar a horario sino como control: si la última revisión
#   tiene menos de 13 h, termina sin hacer nada; si tiene más, cron-job.org
#   dejó de lanzarlo, y entonces revisa igual y manda un mail avisándolo.
#
# El aviso se publica como "issue" del repo: GitHub lo manda por mail al dueño.

name: Monitor normativo

on:
  schedule:
    - cron: '17 */3 * * *' # control cada 3 horas (0:17, 3:17, 6:17... en UTC; 21:17, 0:17, 3:17... en Argentina)
  push: # cada cambio subido sale publicado enseguida (los guardados del robot no disparan esto)
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para correrlo a mano
    inputs:
      reintento:
        description: 'Número de reintento (lo completa el propio monitor)'
        type: number
        default: 0
      prueba_aviso:
        description: 'Mandar un aviso de prueba por mail'
        type: boolean
        default: false

permissions:
  contents: write # guardar el informe del día en el repo
  issues: write # aviso por mail
  actions: write # reprogramarse si falló el Boletín o el BCRA
  pages: write
  id-token: write

jobs:
  # Solo actúa en el control programado de GitHub: ¿cron-job.org viene
  # lanzando las revisiones? Las demás formas de lanzarlo pasan derecho.
  control:
    runs-on: ubuntu-latest
    outputs:
      revisar: ${{ steps.mirar.outputs.revisar }}
      atrasado: ${{ steps.mirar.outputs.atrasado }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: datos/estado.json
          sparse-checkout-cone-mode: false

      - id: mirar
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then echo "revisar=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          horas=$(node -p "const u = require('./datos/estado.json').ultimaCorrida; u ? Math.floor((Date.now() - Date.parse(u)) / 3600000) : 999")
          echo "Última revisión hace $horas h."
          if [ "$horas" -ge 13 ]; then
            echo "revisar=1" >> "$GITHUB_OUTPUT"
            echo "atrasado=$horas" >> "$GITHUB_OUTPUT"
          else
            echo "Al día: no hace falta revisar."
          fi

  revisar:
    needs: control
    if: needs.control.outputs.revisar == '1'
    runs-on: ubuntu-latest
    # Una revisión por vez: las que llegan mientras tanto esperan su turno.
    concurrency:
      group: monitor
      cancel-in-progress: false
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Si una fuente falla, el informe igual se guarda y se publica (con el
      # aviso de la falla). Al final el workflow queda en rojo para que se note.
      - name: Revisar las fuentes
        id: revisar
        continue-on-error: true
        run: npm run revisar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AVISO_ARCHIVO: ${{ runner.temp }}/aviso.json
          REINTENTAR_ARCHIVO: ${{ runner.temp }}/reintentar.txt
          SITIO_URL: https://sys-normativa.github.io/

      - name: Guardar el informe en el repo
        run: |
          git config user.name "monitor-normativo"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -m "Guardar informe del $(TZ=America/Argentina/Buenos_Aires date +%F)"
            # Si mientras corría se subió otro cambio, se suma encima en vez de
            # fallar: si no se guarda el estado, la próxima corrida repite avisos.
            git pull --rebase
            git push
          fi

      # El aviso lo crea el robot del repo: GitHub no avisa por mail de lo que
      # hace uno mismo, por eso la prueba también tiene que salir de acá.
      - name: Preparar aviso de prueba
        if: inputs.prueba_aviso
        env:
          AVISO: ${{ runner.temp }}/aviso.json
        run: |
          cat > "$AVISO" <<'FIN'
          {
            "titulo": "Prueba de aviso del monitor normativo",
            "cuerpo": "Esto es una prueba. @Guidoparisi91 si te llegó este mail, los avisos funcionan.\n\n**[Abrir el monitor](https://sys-normativa.github.io/)**"
          }
          FIN

      - name: Avisar si cron-job.org dejó de lanzar el monitor
        if: needs.control.outputs.atrasado != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HORAS: ${{ needs.control.outputs.atrasado }}
        run: |
          printf '%s\n' "@Guidoparisi91 cron-job.org no lanzó las últimas revisiones (9:47 y 21:47). El control de GitHub revisó igual, pero hay que mirar la tarea en cron-job.org: puede estar pausada o con la clave de GitHub vencida." "" "**[Abrir el monitor](https://sys-normativa.github.io/)**" > "$RUNNER_TEMP/atraso.md"
          url=$(gh issue create --title "Monitor: no se revisó a horario (última revisión hace $HORAS h)" --body-file "$RUNNER_TEMP/atraso.md")
          gh issue close "$url"

      - name: Avisar por mail
        env:
          GH_TOKEN: ${{ github.token }}
          AVISO: ${{ runner.temp }}/aviso.json
        run: |
          if [ -f "$AVISO" ]; then
            titulo=$(node -p "require(process.env.AVISO).titulo")
            node -p "require(process.env.AVISO).cuerpo" > "$RUNNER_TEMP/cuerpo.md"
            url=$(gh issue create --title "$titulo" --body-file "$RUNNER_TEMP/cuerpo.md")
            # Se cierra enseguida: el mail ya salió y la lista de issues queda limpia.
            gh issue close "$url"
          else
            echo "Nada nuevo: no se manda aviso."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: salida

      - name: Publicar la página
        id: publicar
        uses: actions/deploy-pages@v4

      # Si no se pudo leer el Boletín o el BCRA, se vuelve a correr en 15 min, y
      # así hasta que ande. Cada tanda se corta a las 8 h (32 intentos): para
      # entonces ya llegó la pasada siguiente, que arranca otra si hace falta.
      # El mail de la falla sale una sola vez, no en cada intento.
      - name: Reintentar en 15 minutos si falló el Boletín o el BCRA
        id: reintentar
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ inputs.reintento || 0 }}
        run: |
          if [ -f "$RUNNER_TEMP/reintentar.txt" ] && [ "$N" -lt 32 ]; then
            echo "Reintento $((N + 1)) en 15 minutos."
            echo "programado=1" >> "$GITHUB_OUTPUT"
            sleep 900
            gh workflow run monitor.yml --ref main -f reintento=$((N + 1))
          else
            echo "No hace falta reintentar."
          fi

      - name: Marcar en rojo si falló alguna fuente
        if: steps.revisar.outcome == 'failure' && steps.reintentar.outputs.programado != '1'
        run: |
          echo "Alguna fuente no se pudo revisar: ver el informe del día."
          exit 1
